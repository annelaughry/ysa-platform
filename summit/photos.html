<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summit Photos — YSA Youth STEM Summit 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --teal:      #3cbbb1;
      --lavender:  #bbbdf6;
      --pink:      #ee4266;
      --dark:      #0a0f0d;
      --gold:      #f1b643;
      --off-white: #f5f5f0;
      --dark-card: #131a18;
      --dark-card2:#1a2220;
      --muted:     rgba(245,245,240,0.5);
      --border:    rgba(245,245,240,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* hide Google Translate toolbar */
    .goog-te-banner-frame, .skiptranslate { display: none !important; }
    body { top: 0 !important; }
    .goog-te-gadget { display: none !important; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--off-white);
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 2.5rem;
      background: rgba(10,15,13,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(60,187,177,0.15);
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }
    .dot-row { display: flex; gap: 3px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .nav-brand {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--off-white);
      line-height: 1.2;
    }
    .nav-brand span { color: var(--teal); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .nav-back {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-back:hover { color: var(--teal); }

    /* ── HERO ── */
    .hero {
      padding: 8rem 2rem 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(60,187,177,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(187,189,246,0.08) 0%, transparent 50%);
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(60,187,177,0.12);
      border: 1px solid rgba(60,187,177,0.35);
      border-radius: 50px;
      padding: 0.4rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 1.6rem;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 400;
      color: var(--teal);
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .hero-sub {
      color: rgba(245,245,240,0.6);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ── GALLERY ── */
    .gallery-section {
      padding: 3rem 2rem 6rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .photo-grid {
      column-count: 3;
      column-gap: 12px;
    }
    @media (max-width: 900px) {
      .photo-grid { column-count: 2; }
    }
    @media (max-width: 560px) {
      .photo-grid { column-count: 1; }
      nav { padding: 0.9rem 1.2rem; }
      .nav-brand { display: none; }
    }

    .photo-item {
      break-inside: avoid;
      display: block;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
    }
    .photo-item img {
      width: 100%;
      display: block;
      border-radius: 10px;
      object-fit: cover;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .photo-item:hover img {
      transform: scale(1.03);
      opacity: 0.85;
    }
    .photo-item::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      border: 1px solid rgba(60,187,177,0);
      transition: border-color 0.25s;
      pointer-events: none;
    }
    .photo-item:hover::after {
      border-color: rgba(60,187,177,0.4);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(10,15,13,0.96);
      backdrop-filter: blur(16px);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox-img {
      max-width: min(90vw, 1000px);
      max-height: 88vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
      cursor: default;
      pointer-events: none;
    }
    .lightbox-close {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      background: rgba(245,245,240,0.08);
      border: 1px solid rgba(245,245,240,0.15);
      color: var(--off-white);
      font-size: 1.3rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      line-height: 1;
    }
    .lightbox-close:hover { background: rgba(60,187,177,0.2); }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(245,245,240,0.08);
      border: 1px solid rgba(245,245,240,0.15);
      color: var(--off-white);
      font-size: 1.4rem;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .lightbox-nav:hover { background: rgba(60,187,177,0.2); }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-counter {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(245,245,240,0.4);
      letter-spacing: 0.1em;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(245,245,240,0.06);
      padding: 2.5rem 2rem;
      text-align: center;
      color: rgba(245,245,240,0.3);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }
    footer a {
      color: var(--teal);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>

  <script>
    const photos = [
      'photos/442418060_930234325655028_5021156215825428614_n.jpg',

      'photos/492080225_1745901722926379_5710448759085400067_n.jpg',

      'photos/492108289_1745901656259719_2526530837770097615_n.jpg',
      'photos/492111511_1745901432926408_2310619275634293226_n.jpg',
      'photos/492113281_1745900772926474_3515251880745001646_n.jpg',
      'photos/492141902_1745901609593057_972695530303150179_n.jpg',
      'photos/492142861_1745901582926393_3225904104432952324_n.jpg',
      'photos/492165610_1745900609593157_2359877448365236758_n.jpg',
      'photos/492197089_1745901572926394_1469211189646447469_n.jpg',
      'photos/492228200_1745899626259922_1477738991162105037_n.jpg',

      'photos/492405465_1745901732926378_1509476857196207166_n.jpg',
      'photos/492425692_1745901422926409_2383492931875133041_n.jpg',
      'photos/499242391_1772210136962204_4249429134890230813_n.jpg',
      'photos/499767264_1772210610295490_2201944049346961709_n.jpg',
      'photos/499810831_1772211033628781_7164355951506069465_n.jpg',
      'photos/500068675_1772211733628711_3887188223679067121_n.jpg',
    ];

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      document.getElementById('lightboxImg').src = photos[index];
      document.getElementById('lightboxCounter').textContent = (index + 1) + ' / ' + photos.length;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
      if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lightbox-close')) return;
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function navLightbox(dir, e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      document.getElementById('lightboxImg').src = photos[currentIndex];
      document.getElementById('lightboxCounter').textContent = (currentIndex + 1) + ' / ' + photos.length;
    }

    document.addEventListener('keydown', function(e) {
      const lb = document.getElementById('lightbox');
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') { lb.classList.remove('open'); document.body.style.overflow = ''; }
      if (e.key === 'ArrowRight') navLightbox(1, null);
      if (e.key === 'ArrowLeft') navLightbox(-1, null);
    });
  </script>
