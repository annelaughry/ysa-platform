<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg20" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1f00"/>
      <stop offset="100%" stop-color="#0f0a00"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg20)" rx="36"/>
  <circle cx="250" cy="200" r="160" fill="rgba(241,182,67,0.06)"/>

  <!-- Pollen grain - main circle -->
  <circle cx="250" cy="210" r="95" fill="none" stroke="#f1b643" stroke-width="5"/>

  <!-- Pollen spikes radiating out -->
  <g stroke="#f1b643" stroke-width="3.5" stroke-linecap="round">
    <line x1="250" y1="115" x2="250" y2="95"/><circle cx="250" cy="90" r="7" fill="#f1b643"/>
    <line x1="317" y1="143" x2="330" y2="130"/><circle cx="336" cy="124" r="7" fill="#f1b643"/>
    <line x1="345" y1="210" x2="365" y2="210"/><circle cx="371" cy="210" r="7" fill="#f1b643"/>
    <line x1="317" y1="277" x2="330" y2="290"/><circle cx="336" cy="296" r="7" fill="#f1b643"/>
    <line x1="250" y1="305" x2="250" y2="325"/><circle cx="250" cy="331" r="7" fill="#f1b643"/>
    <line x1="183" y1="277" x2="170" y2="290"/><circle cx="164" cy="296" r="7" fill="#f1b643"/>
    <line x1="155" y1="210" x2="135" y2="210"/><circle cx="129" cy="210" r="7" fill="#f1b643"/>
    <line x1="183" y1="143" x2="170" y2="130"/><circle cx="164" cy="124" r="7" fill="#f1b643"/>
  </g>

  <!-- Inner texture dots (pollen texture) -->
  <g fill="rgba(241,182,67,0.35)">
    <circle cx="250" cy="210" r="8"/>
    <circle cx="275" cy="185" r="5"/>
    <circle cx="225" cy="185" r="5"/>
    <circle cx="275" cy="235" r="5"/>
    <circle cx="225" cy="235" r="5"/>
    <circle cx="250" cy="175" r="4"/>
    <circle cx="250" cy="245" r="4"/>
    <circle cx="285" cy="210" r="4"/>
    <circle cx="215" cy="210" r="4"/>
  </g>

  <!-- Microscope element - small -->
  <g transform="translate(310,135) scale(0.55)" opacity="0.5">
    <rect x="-12" y="-60" width="24" height="80" rx="4" fill="#f1b643"/>
    <ellipse cx="0" cy="-65" rx="18" ry="10" fill="#f1b643"/>
    <rect x="-6" y="20" width="12" height="30" rx="2" fill="#f1b643"/>
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#f1b643" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 20dm³ text -->
  <text x="250" y="392" text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-weight="900" font-size="72" letter-spacing="-2"
        fill="#f1b643">20dm</text>
  <text x="370" y="378" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="700" font-size="28"
        fill="#f1b643">3</text>

  <!-- Divider -->
  <rect x="130" y="402" width="240" height="3" rx="2" fill="rgba(241,182,67,0.4)"/>

  <!-- Tagline -->
  <text x="250" y="428" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="600"
        font-size="15" letter-spacing="5"
        fill="rgba(241,182,67,0.6)">POLLEN &amp; ALLERGENS</text>
</svg>
