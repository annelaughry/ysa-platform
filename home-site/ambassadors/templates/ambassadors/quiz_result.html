{% extends 'base.html' %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal:     #3cbbb1;
    --lavender: #bbbdf6;
    --pink:     #ee4266;
    --dark:     #0a0f0d;
    --gold:     #f1b643;
    --amber:    #c4903a;
    --off-white:#f5f5f0;
    --card-bg:  #111a15;
    --border:   color-mix(in srgb, var(--off-white) 8%, transparent);
  }

  .result-wrap {
    min-height: 100vh;
    background: var(--dark);
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .result-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: color-mix(in srgb, var(--off-white) 40%, transparent);
    margin-bottom: 1.2rem;
    text-align: center;
  }

  .result-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: 4px solid var(--tc);
    border-radius: 20px;
    padding: 3rem 2.5rem 2.5rem;
    max-width: 480px;
    width: 100%;
    text-align: center;
    position: relative;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .result-flag {
    font-size: 4rem;
    line-height: 1;
    margin-bottom: 0.75rem;
  }

  .result-team-name {
    font-size: 2rem;
    font-weight: 900;
    color: var(--tc);
    margin-bottom: 0.3rem;
    line-height: 1.2;
  }

  .result-country {
    font-size: 0.85rem;
    color: color-mix(in srgb, var(--off-white) 40%, transparent);
    margin-bottom: 1rem;
  }

  .result-vibe {
    display: inline-block;
    background: rgba(60,187,177,0.12);
    border: 1px solid rgba(60,187,177,0.25);
    color: var(--teal);
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.3rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.5rem;
  }

  .result-desc {
    font-size: 0.95rem;
    color: color-mix(in srgb, var(--off-white) 60%, transparent);
    line-height: 1.65;
    margin-bottom: 2.5rem;
  }

  .cta-stack {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .btn-teal {
    display: inline-block;
    background: var(--tc);
    color: var(--dark);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 0.85rem 2rem;
    border-radius: 10px;
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .btn-teal:hover { opacity: 0.85; }

  .btn-ghost {
    display: inline-block;
    background: none;
    border: 1px solid var(--border);
    color: color-mix(in srgb, var(--off-white) 50%, transparent);
    font-weight: 600;
    font-size: 0.875rem;
    padding: 0.75rem 2rem;
    border-radius: 10px;
    text-decoration: none;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-ghost:hover {
    border-color: color-mix(in srgb, var(--off-white) 30%, transparent);
    color: var(--off-white);
  }

  .confetti-strip {
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    margin-bottom: 1.5rem;
    animation: floatConfetti 2s ease-in-out infinite alternate;
  }

  @keyframes floatConfetti {
    from { transform: translateY(0); }
    to   { transform: translateY(-6px); }
  }
</style>

<div class="result-wrap">
  <div class="result-label">Your team match</div>

  <div class="result-card" style="--tc: {{ team.color }};">
    <div class="confetti-strip">🎉 ✨ 🔬</div>
    <div class="result-flag">{{ team.flag }}</div>
    <div class="result-team-name">{{ team.name }}</div>
    <div class="result-country">{{ team.country }}</div>
    <div class="result-vibe">This team matches your vibe!</div>
    <div class="result-desc">{{ team.desc }}</div>

    <div class="cta-stack">
      <a href="{% url 'ambassadors:teams' %}" class="btn-teal">Explore All Teams &rarr;</a>
      <a href="{% url 'ambassadors:quiz' %}" class="btn-ghost">Retake the quiz</a>
    </div>
  </div>
</div>
{% endblock %}
